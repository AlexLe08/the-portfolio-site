services:
  - type: web
    name: portfolio-backend
    runtime: docker
    plan: free
    rootDir: backend
    # No dockerCommand override -- uses the Dockerfile's own CMD, which
    # already reads $PORT (see Dockerfile). rootDir matters specifically
    # because this is a monorepo: without it, Render would look for a
    # Dockerfile at the repo root, not inside backend/.
    healthCheckPath: /health
    # Migrations run inside the container's own startup command instead
    # of here -- see Dockerfile. preDeployCommand is a paid-plan-only
    # feature on Render; the free plan rejects a Blueprint that sets it,
    # even as an unused/empty value.
    # This results in one extra database round trip to check the migration version each wake-up, as Free-tier has frequent 15 minute idle sleep cycles; milliseconds of increased time, acceptable at this scale for a free project.
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false # set manually in the Render dashboard to your Neon connection string -- never committed
      - key: ADMIN_API_KEY
        generateValue: true # Render generates and stores a random secret; view it in the dashboard when you need it for admin requests
      - key: JWT_SECRET
        generateValue: true # signs admin session tokens; regenerate it in the dashboard to log out every session
      - key: ADMIN_PASSWORD_HASH # set manually: output of backend/hash_password.py; admin login stays off until set
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false # set manually once you know your Vercel production URL
      - key: DISCORD_WEBHOOK_URL # set manually in the Render dashboard after generating a webhook url
        sync: false
      - key: RESEND_API_KEY # set manually in the Render dashboard (Resend > API Keys); optional, email is skipped when empty
        sync: false
      - key: NOTIFY_EMAIL_TO # set manually: the address that receives contact messages (your Resend account email)
        sync: false
      - key: CLIENT_IP_HEADER # names the visitor for the /contact rate limit; see docs/render-runbook.md
        value: CF-Connecting-IP
      - key: SENTRY_DSN # set manually: the Sentry project's DSN; optional, error reporting is off when empty
        sync: false
      - key: CLOUDINARY_URL # set manually: Cloudinary API environment variable; optional, uploads are off when empty
        sync: false
