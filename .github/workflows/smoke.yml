name: Smoke tests

# Runs Playwright against the deployed site (frontend/e2e). Not a required
# check: it tests production after a merge, so it can't gate the PR.
#
# Triggers:
# - deployment_status: Vercel reports each production deploy to GitHub as
#   a deployment. Its success means the new frontend is live. Render
#   reports its deploys too; the job's `if` skips those (and previews).
# - schedule: daily, so breakage with no deploy (expired env var, Neon or
#   Render trouble) still shows up.
# - workflow_dispatch: run by hand from the Actions tab.
on:
  deployment_status:
  schedule:
    - cron: "17 13 * * *" # 13:17 UTC; off the hour, when GitHub's queue is busiest
  workflow_dispatch:

concurrency:
  group: smoke
  cancel-in-progress: false

jobs:
  smoke:
    if: >-
      github.event_name != 'deployment_status' ||
      (github.event.deployment.environment == 'Production' &&
       github.event.deployment_status.state == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASE_URL: https://the-portfolio-site-flax.vercel.app
      API_URL: https://portfolio-backend-leto.onrender.com
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4
        with:
          # The wait step diffs the deployed backend commit against this one.
          fetch-depth: 0

      # Vercel can finish before Render, and Render skips deploys that don't
      # touch backend/. The script explains both; it's also run by hand.
      - name: Wait for the backend to match this commit
        if: github.event_name == 'deployment_status'
        working-directory: .
        run: scripts/wait-for-backend.sh "$GITHUB_SHA" "$API_URL"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run smoke tests
        run: npm run test:smoke

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
