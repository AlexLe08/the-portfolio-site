name: Frontend CI

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/frontend.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: package-lock.json

      # npm workspaces: one lockfile at the repo root for frontend/ and
      # packages/.
      - name: Install dependencies
        working-directory: .
        run: npm ci

      - name: Lint
        run: npm run lint

      # Vitest: lib/ helpers, then the character sheet package's own tests.
      - name: Unit tests
        run: npm test

      - name: Build (includes TypeScript check)
        run: npm run build